x-build: &build
  # Run the vendored chatwoot/ source instead of the prebuilt chatwoot/chatwoot:latest image.
  # Paths are relative to chatwoot/ (the first compose file's directory).
  image: dx-osd/chatwoot:local
  build:
    context: .
    dockerfile: docker/Dockerfile

services:
  base: *build
  rails:
    <<: *build
    environment:
      - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=true
  sidekiq:
    <<: *build
    environment:
      - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=true
  postgres:
    ports: !override
      - '127.0.0.1:15432:5432'
    environment: !override
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  redis:
    image: redis:7.2.4-alpine
    ports: !override
      - '127.0.0.1:16379:6379'
