x-build: &build
  # Run the vendored chatwoot/ source instead of the prebuilt chatwoot/chatwoot:latest image.
  # Paths are relative to chatwoot/ (the first compose file's directory).
  image: dx-osd/chatwoot:local
  build:
    context: .
    dockerfile: docker/Dockerfile

services:
  base: *build
  rails: *build
  sidekiq: *build
  postgres:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b  # PostgreSQL 16.15, pgvector 0.8.6
    ports: !override
      - '127.0.0.1:15432:5432'
    environment: !override
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  redis:
    image: redis@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d  # Redis 8.10.2
